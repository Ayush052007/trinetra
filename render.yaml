# Render blueprint for TRINETRA.
#
#   1. Push this repository to GitHub
#   2. Render dashboard -> New -> Blueprint -> pick the repo
#   3. Set SEED_PASSWORD when prompted (see docs/DEPLOYMENT.md)
#
# Everything else is configured here. The database seeds itself on first boot.

services:
  - type: web
    name: trinetra
    runtime: python
    plan: free
    region: singapore          # closest to India; change if you prefer
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONPATH
        value: backend:database:ai:graph

      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true    # Render generates and stores a strong key

      - key: DATABASE_URL      # wired to the managed PostgreSQL below
        fromDatabase:
          name: trinetra-db
          property: connectionString

      # Populate the database on first boot - there is no shell on the free plan.
      - key: AUTO_SEED
        value: "true"
      - key: SEED_WITH_CORPUS
        value: "true"

      # One shared password for all demo accounts, because the generated
      # credentials file would land on an ephemeral disk. Only acceptable for a
      # synthetic-data demonstration instance. Set this yourself in the
      # dashboard - 12+ chars with upper, lower, digit and symbol.
      - key: SEED_PASSWORD
        sync: false

      - key: DATA_CLASSIFICATION
        value: SYNTHETIC
      - key: SHOW_CLASSIFICATION_BANNER
        value: "true"

databases:
  - name: trinetra-db
    plan: free
    databaseName: trinetra
    user: trinetra
